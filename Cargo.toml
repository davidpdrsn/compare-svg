[package]
name = "compare-svg"
version = "0.1.0"
edition = "2024"
description = "Compare SVGs in the working tree with their versions at Git HEAD"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
gix = { version = "0.87", default-features = false, features = ["sha1"] }
open = "5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch.crates-io]
bisync = { git = "https://github.com/JM4ier/bisync.git", rev = "be3a0a6255a0af592e66be8614a149151f67fdf5" }
